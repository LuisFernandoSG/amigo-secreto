<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#164e35" />
    <title>Amigo Secreto · Intercambio Navideño Familiar</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="christmas-lights-wrapper"></div>
    <canvas id="snow-canvas"></canvas>

    <header class="top-navbar">
      <div class="navbar-inner">
        <div class="brand-logo" onclick="window.app && window.app.goHome()">
          <div class="brand-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-7 9h4l-4 7h14l-4-7h4L12 3z"/>
              <path d="M12 19v3"/>
            </svg>
          </div>
          <div>
            <span class="brand-title">Amigo Secreto</span>
            <span class="brand-subtitle">Intercambio Navideño Familiar</span>
          </div>
        </div>

        <div class="nav-controls" id="navbar-controls"></div>
      </div>
    </header>

    <main class="app-container" id="app-root">
      <div class="clean-card" style="text-align: center; padding: 3rem;">
        <h2 class="font-festive">Cargando...</h2>
      </div>
    </main>

    <div id="modal-root"></div>
    <div id="toast-container"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/soundEngine.js"></script>
    <script src="/js/effects.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
